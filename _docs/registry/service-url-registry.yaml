# Kiorex and Kiorly service URL registry (CANONICAL, machine-readable). Proposed by ADR-059 (27 Nov 2026), unsigned until the founder signs.
#
# One source of truth for every host the ecosystem uses. Docs reference this file and never copy hostnames into new sources of truth.
# Hosts are DERIVED, not typed:   <service label>.<environment label>.<domain>   (production has an empty environment label, so it
# is <service label>.<domain>; an empty service label means the environment apex, e.g. test.kiorex.com or kiorex.com).
# Consumers (CORS lists, OIDC redirect URIs, env files, certificate SANs, DNS records) are generated by validate-registry.mjs --emit.
#
# YAML subset used (the validator has its own tiny parser, no dependencies): 2-space indent, "key: value", block lists with "- ",
# inline lists [a, b], double-quoted strings, true/false/null, full-line and trailing "# comments". No anchors, no multi-line scalars.
#
# SCHEMA (all keys required unless marked optional)
#   schema_version                 integer, currently 1
#   domains.<key>                  registrable domain, key used by services.domain
#   environments[]                 id (dev|test|staging|pilot|prod), tag (founder tag: kx-test, kx-pilot, kx-pro), label (DNS label, "" for prod),
#                                  plane (which data plane serves it: pilot runs on the prod plane), state (reserved|active|planned),
#                                  data_class (synthetic | synthetic-plus-designated-real-org | real), aws_account, region, access (notes)
#   oidc.issuer_service            service id that is the IdP
#   oidc.issuer_env                map env -> env whose issuer the clients of that env use (pilot uses prod: no account migration)
#   services[]                     id, domain, label, kind (web|api|idp|gateway|alias|assets|internal|static), exposure (public|public-signed|gateway-only|internal),
#                                  dns (public|none), repo, core (true: must exist in test, pilot and prod), envs, status (live|planned|reserved|alias),
#                                  optional: alias_of, live_envs (envs where status live is true), env (map of ENV_VAR -> template), note
#   env templates                  {url:<id>} https origin of a service, {host:<id>}, {issuer}, {cors}, {env}, {env_tag}, {plane}
#   cors.<service id>              list of service ids whose origin may call that service (browser CORS allow-list)
#   oidc_clients[]                 id, service (web host), redirect_paths, post_logout_paths, optional backchannel_service + backchannel_path, kind web|native
#   native_clients[]               id, custom scheme(s) and redirect paths (not hosts; PKCE protects, universal links preferred in production)
#   app_links                      mobile universal-link / app-link host services per app
#   legacy_hosts[]                 hosts that exist today and must keep working: host, env, service, status, keep_until, note
#   superseded_hosts[]             ADR-038 hosts that never went live, with the registry service that replaces them
#   code_scan                      strict_paths (zero hardcoded domains allowed) and report_paths (counted, listed in the docs)
#
schema_version: 1
updated: 2026-11-27
status: proposed

domains:
  kiorex: kiorex.com
  kiorly: kiorly.com
  link: kiorly.link

environments:
  - id: dev
    tag: kx-dev
    label: dev
    plane: dev
    state: reserved
    data_class: synthetic
    aws_account: "990597228737"
    region: eu-central-1
    access: "reserved name only; not provisioned (cost)"
  - id: test
    tag: kx-test
    label: test
    plane: test
    state: active
    data_class: synthetic-plus-designated-real-org
    aws_account: "990597228737"
    region: eu-central-1
    access: "invitation-only accounts, noindex, no public sign-up, CDN header gate for non-allow-listed visitors"
  - id: staging
    tag: kx-staging
    label: staging
    plane: staging
    state: reserved
    data_class: synthetic
    aws_account: "TBD-HB05"
    region: eu-central-1
    access: "reserved name only; not provisioned (cost)"
  - id: pilot
    tag: kx-pilot
    label: pilot
    plane: prod
    state: planned
    data_class: real
    aws_account: "TBD-HB05"
    region: eu-central-1
    access: "production controls; tenant cohort flag; invitation-only"
  - id: prod
    tag: kx-pro
    label: ""
    plane: prod
    state: planned
    data_class: real
    aws_account: "TBD-HB05"
    region: eu-central-1
    access: "public"

oidc:
  issuer_service: kiorex.passport
  issuer_env:
    dev: dev
    test: test
    staging: staging
    pilot: prod
    prod: prod

services:
  # ---- Kiorex (patients, identity, platform) ----
  - id: kiorex.marketplace
    domain: kiorex
    label: ""
    kind: web
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    env:
      WEB_BASE_URL: "{url:kiorex.marketplace}"
      SITE_CANONICAL_HOST: "{url:kiorex.marketplace}"
      VITE_OIDC_AUTHORITY: "{issuer}"
  - id: kiorex.api
    domain: kiorex
    label: api
    kind: gateway
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    env:
      PUBLIC_BASE_URL: "{url:kiorex.api}"
      PUBLIC_APP_URL: "{url:kiorex.marketplace}/app"
      OIDC_ISSUER: "{issuer}"
      CORS_ORIGINS: "{cors}"
      WIDGET_HOST: "{host:kiorex.widget}"
      KIORLY_BASE_URL: "{url:kiorly.clinics}/marketplace/v1" # 27 Nov 2026: the Clinic web host routes /marketplace/* to its API (signed partner API outside /api/v1), like pharmacies and labs; the gateway form stays planned
  - id: kiorex.admin
    domain: kiorex
    label: admin
    kind: web
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Replaces the ops.kiorex.com name used in the platform .env example (the Ops console is the Kiorex super admin)."
    env:
      VITE_OIDC_AUTHORITY: "{issuer}"
  - id: kiorex.passport
    domain: kiorex
    label: passport
    kind: idp
    exposure: public
    dns: public
    repo: kiorex-account
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Pilot clients use the PRODUCTION issuer (oidc.issuer_env). passport.pilot.kiorex.com is reserved as a redirect only and never an issuer."
    env:
      ISSUER: "{issuer}"
      KX_HOME_ORIGIN: "{url:kiorly.app}"
  - id: kiorex.ai
    domain: kiorex
    label: ai
    kind: internal
    exposure: gateway-only
    dns: none
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: reserved
    note: "Name reserved, no public DNS record. Reachable only through the authenticated API gateway (kiorex.api) or private service discovery."
  - id: kiorex.webhooks
    domain: kiorex
    label: webhooks
    kind: gateway
    exposure: public-signed
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Inbound partner and provider webhooks (HMAC or provider signature). Routes to the platform API under /api/v1/webhooks/*."
    env:
      KIOREX_OUTBOX_WEBHOOK_URL: "{url:kiorex.webhooks}/api/v1/webhooks/kiorly"
      KIOREX_WEBHOOK_URL: "{url:kiorex.webhooks}/api/v1/webhooks"
  - id: kiorex.cdn
    domain: kiorex
    label: cdn
    kind: assets
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: reserved
    note: "Static assets and the widget SDK files. Reserved; no distribution until a second consumer exists (cost)."
  - id: kiorex.widget
    domain: kiorex
    label: book
    kind: web
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [test, pilot, prod]
    status: planned
    note: "Existing decision ADR-044 (booking widget host, role of the platform API image). Not in the founder brief; kept because it already follows the pattern. Founder to confirm."
  - id: kiorex.developers
    domain: kiorex
    label: developers
    kind: static
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [prod]
    status: reserved
  - id: kiorex.docs
    domain: kiorex
    label: docs
    kind: static
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [prod]
    status: reserved
  - id: kiorex.status
    domain: kiorex
    label: status
    kind: static
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [prod]
    status: reserved
    note: "Host this on a provider outside our own AWS account so it works during an outage."
  - id: kiorex.support
    domain: kiorex
    label: support
    kind: static
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [prod]
    status: reserved

  # ---- Kiorly (provider products) ----
  - id: kiorly.marketing
    domain: kiorly
    label: ""
    kind: static
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Public marketing, plans, lead generation, provider onboarding: kiorex-account/apps/kiorly-site (static, S3 + CloudFront, directory index rewrite). Hosted on test (test.kiorly.com, mock lead form, noindex) since 27 Nov 2026."
  - id: kiorly.app
    domain: kiorly
    label: app
    kind: web
    exposure: public
    dns: public
    repo: kiorex-account
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Kiorly Home: one sign-in and workspace switcher (ADR-038). Also the staff app universal-link host. Replaces www.kiorly.com/signin."
    env:
      VITE_KIORLY_HOME_URL: "{url:kiorly.app}"
      KIORLY_HOME_ORIGINS: "{url:kiorly.app}"
  - id: kiorly.clinics
    domain: kiorly
    label: clinics
    kind: web
    exposure: public
    dns: public
    repo: clinics-management
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "Live on kx-test since 27 Nov 2026 at clinics.test.kiorly.com (a second, OpenTofu-managed distribution that chains to the legacy distribution for the SPA and routes /api/* and /marketplace/* to the same App Runner origin; infra/tofu/modules/clinic_link) and still at the legacy host d92iz83i79c05.cloudfront.net, which never goes away (see legacy_hosts). The Clinic CDK stack owns the legacy distribution, so the alias is not added there."
    env:
      APP_WEB_URL: "{url:kiorly.clinics}"
      WEB_PUBLIC_ORIGIN: "{url:kiorly.clinics}"
      KIOREX_OIDC_ISSUER: "{issuer}"
      KIORLY_HOME_ORIGINS: "{url:kiorly.app}"
      KIOREX_OUTBOX_WEBHOOK_URL: "{url:kiorex.webhooks}/api/v1/webhooks/kiorly"
      KIOREX_WIDGET_BASE_URL: "{url:kiorex.widget}"
      KIOREX_API_BASE_URL: "{url:kiorex.api}/api/v1"
      KIOREX_PATIENT_WEB_URL: "{url:kiorex.marketplace}"
      WEB_BASE_URL: "{url:kiorly.clinics}"
  - id: kiorly.pharmacies
    domain: kiorly
    label: pharmacies
    kind: web
    exposure: public
    dns: public
    repo: kiorly-pharmacy
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    env:
      WEB_APP_URL: "{url:kiorly.pharmacies}"
      OIDC_ISSUER: "{issuer}"
      KIORLY_HOME_ORIGINS: "{url:kiorly.app}"
      KIOREX_WEBHOOK_URL: "{url:kiorex.webhooks}/api/v1/webhooks/pharmacy"
  - id: kiorly.labs
    domain: kiorly
    label: labs
    kind: web
    exposure: public
    dns: public
    repo: kiorly-lab
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    env:
      PUBLIC_BASE_URL: "{url:kiorly.labs}"
      OIDC_ISSUER: "{issuer}"
      KIORLY_HOME_ORIGINS: "{url:kiorly.app}"
      KIOREX_WEBHOOK_URL: "{url:kiorex.webhooks}/api/v1/webhooks/lab"
  - id: kiorly.admin
    domain: kiorly
    label: admin
    kind: web
    exposure: public
    dns: public
    repo: kiorex-platform
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "The Kiorly admin is the SAME Ops console build served on this host (apps/ops, edition detected from the host: Kiorly marks, provider-product views only). Same Passport client kiorex-ops with one more redirect URI (oidc client kiorex-ops-kiorly), same-origin /api routed to the Kiorex API at the CDN, ops roles only. See kiorex-platform/Docs/KIORLY_ADMIN.md."
    env:
      VITE_KIORLY_ADMIN_HOSTS: "{host:kiorly.admin}"
  - id: kiorly.api
    domain: kiorly
    label: api
    kind: gateway
    exposure: public
    dns: public
    repo: clinics-management
    core: true
    envs: [dev, test, staging, pilot, prod]
    status: planned
    note: "One gateway host; first path segment selects the product (/clinics, /pharmacies, /labs) and is stripped at the edge. Needs verification per product; until then each web serves its own same-origin /api/*."
  - id: kiorly.nurse
    domain: kiorly
    label: nurse
    kind: alias
    alias_of: kiorly.clinics
    exposure: public
    dns: public
    repo: clinics-management
    core: false
    envs: [test, pilot, prod]
    status: alias
    note: "Nurse is an edition of Clinic (ADR-031). The Clinic web detects the NURSE edition by the host nurse.kiorly.com today (apps/web/src/lib/edition.ts); kept as an alias so that keeps working."
  - id: kiorly.link
    domain: link
    label: ""
    kind: web
    exposure: public
    dns: public
    repo: kiorex-platform
    core: false
    envs: [test, pilot, prod]
    status: reserved
    note: "Short booking links (ADR-040, open decision NH-008). Third domain, not in the founder brief; founder to confirm it is owned and wanted."

cors:
  kiorex.api: [kiorex.marketplace, kiorex.admin, kiorex.widget, kiorly.app]
  kiorly.api: [kiorly.app, kiorly.clinics, kiorly.pharmacies, kiorly.labs, kiorly.nurse, kiorly.admin]
  kiorex.passport: [kiorex.marketplace, kiorex.admin, kiorly.app]

oidc_clients:
  - id: kiorex-web
    service: kiorex.marketplace
    redirect_paths: [/auth/callback]
    post_logout_paths: [/]
    backchannel_service: kiorex.api
    backchannel_path: /api/v1/auth/backchannel-logout
  - id: kiorex-ops
    service: kiorex.admin
    redirect_paths: [/auth/callback]
    post_logout_paths: [/]
    backchannel_service: kiorex.api
    backchannel_path: /api/v1/auth/backchannel-logout
  - id: kiorex-ops-kiorly
    service: kiorly.admin
    redirect_paths: [/auth/callback]
    post_logout_paths: [/]
    backchannel_service: kiorex.api
    backchannel_path: /api/v1/auth/backchannel-logout
  - id: kiorex-widget
    service: kiorex.widget
    redirect_paths: [/v1/embed/auth/callback]
    post_logout_paths: []
  - id: kiorly-home
    service: kiorly.app
    redirect_paths: [/signin/callback]
    post_logout_paths: [/signin]
  - id: kiorly-clinic
    service: kiorly.clinics
    redirect_paths: [/auth/kiorex/callback]
    post_logout_paths: [/]
    backchannel_service: kiorly.api
    backchannel_path: /clinics/api/v1/auth/kiorex/backchannel-logout
  - id: kiorly-clinic-nurse
    service: kiorly.nurse
    redirect_paths: [/auth/kiorex/callback]
    post_logout_paths: [/]
    backchannel_service: kiorly.api
    backchannel_path: /clinics/api/v1/auth/kiorex/backchannel-logout
  - id: kiorly-pharmacy-web
    service: kiorly.pharmacies
    redirect_paths: [/auth/callback]
    post_logout_paths: [/]
    backchannel_service: kiorly.api
    backchannel_path: /pharmacies/api/v1/auth/oidc/backchannel-logout
  - id: kiorly-lab-web
    service: kiorly.labs
    redirect_paths: [/auth/callback]
    post_logout_paths: [/]
    backchannel_service: kiorly.api
    backchannel_path: /labs/api/v1/auth/oidc/backchannel-logout
  - id: passport-account
    service: kiorex.passport
    redirect_paths: [/account/callback]
    post_logout_paths: [/account]

native_clients:
  - id: kiorex
    bundle_id: com.kiorex.app
    schemes: [kiorex]
    redirect_paths: ["kiorex://auth/callback"]
  - id: kiorly
    bundle_id: com.kiorly.app
    schemes: [kiorly]
    redirect_paths: ["kiorly://auth/callback"]
    note: "Non-production builds should use a distinct bundle id suffix (.test) and scheme (kiorly-test) so builds install side by side and a test build cannot claim production links."

app_links:
  staff_app_host_service: kiorly.app
  patient_app_host_service: kiorex.marketplace

legacy_hosts:
  - id: legacy.clinic-cloudfront
    host: d92iz83i79c05.cloudfront.net
    env: test
    service: kiorly.clinics
    status: live
    cloudfront_distribution: E1DE0H2K3M17YL
    keep_until: never-without-founder-approval
    note: "The live AWS Clinic (account 990597228737, eu-central-1) with the real organisation Dr Ahmed Shall. Stays reachable forever as the default CloudFront domain; the canonical name clinics.test.kiorly.com is served by a SECOND distribution (OpenTofu, infra/tofu/modules/clinic_link) because the CDK stack owns this one; this host is never replaced. Allowed in kx-test CORS and OIDC redirect lists until retired."

superseded_hosts:
  - host: account.kiorex.com
    replaced_by: kiorex.passport
  - host: account.staging.kiorex.com
    replaced_by: kiorex.passport
  - host: www.staging.kiorex.com
    replaced_by: kiorex.marketplace
  - host: www.kiorly.com
    replaced_by: kiorly.app
  - host: clinic.kiorly.com
    replaced_by: kiorly.clinics
  - host: pharmacy.kiorly.com
    replaced_by: kiorly.pharmacies
  - host: lab.kiorly.com
    replaced_by: kiorly.labs
  - host: api.clinic.kiorly.com
    replaced_by: kiorly.api
  - host: api.pharmacy.kiorly.com
    replaced_by: kiorly.api
  - host: api.lab.kiorly.com
    replaced_by: kiorly.api
  - host: ops.kiorex.com
    replaced_by: kiorex.admin
  - host: staging.kiorly.link
    replaced_by: kiorly.link

code_scan:
  strict_paths: [_docs/registry/samples]
  report_paths: [kiorex-platform, kiorex-account, clinics-management, kiorly-pharmacy, kiorly-lab, kiorly]
