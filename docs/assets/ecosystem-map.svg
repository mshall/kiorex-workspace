<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-label="Kiorex v2 ecosystem map" font-family="Jost, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Kiorex v2 ecosystem map</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3730A3"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8735E"/></marker></defs>
<rect width="1100" height="580" rx="18" fill="#F4F6FC"/>
<rect x="0" y="0" width="1100" height="6" rx="3" fill="url(#g)"/><text x="32" y="46" font-size="22" font-weight="600" fill="#1E1B4B">Kiorex v2 ecosystem</text><text x="32" y="68" font-size="13" fill="#475569">Two brands, four products, one contract layer. Products never share a database; they talk over signed HTTP and webhooks.</text><rect x="40" y="100" width="320" height="90" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="200" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorex Passport</text><text x="200" y="160" text-anchor="middle" font-size="11" fill="#475569">kiorex-account · OIDC · phone OTP · :4400</text><rect x="390" y="100" width="320" height="90" rx="10" fill="#EEF2FF" stroke="#3730A3" stroke-width="1.6"/>
<text x="550" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorex (patients)</text><text x="550" y="160" text-anchor="middle" font-size="11" fill="#475569">kiorex-platform · API :4000 · web :5180 · ops :5181</text><rect x="740" y="100" width="320" height="90" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
<text x="900" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">kiorex-contracts</text><text x="900" y="160" text-anchor="middle" font-size="11" fill="#475569">OpenAPI · event schemas · flags · HMAC SDK</text><path d="M360 145L390 145" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M740 145L710 145" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M550 190V250M155 250H655" stroke="#3730A3" stroke-width="1.8" fill="none"/><path d="M155 250L155 330" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M195 330L195 250" stroke="#E8735E" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/><path d="M405 250L405 330" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M445 330L445 250" stroke="#E8735E" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/><path d="M655 250L655 330" stroke="#3730A3" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><path d="M695 330L695 250" stroke="#E8735E" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/><text x="700" y="225" text-anchor="start" font-size="11" fill="#3730A3" font-weight="600">HMAC REST (holds, confirm, partner orders) · Kiorex Pay · flag snapshot + push</text><text x="700" y="247" text-anchor="start" font-size="11" fill="#E8735E" font-weight="600">outbox webhooks back to Kiorex (coral dashed)</text><rect x="40" y="330" width="230" height="100" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="155" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorly Clinic</text><text x="155" y="395" text-anchor="middle" font-size="11" fill="#475569">branch kiorex · :3010 / :5174</text><rect x="290" y="330" width="230" height="100" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="405" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorly Pharmacy</text><text x="405" y="395" text-anchor="middle" font-size="11" fill="#475569">kiorly-pharmacy · :3100 / :5192</text><rect x="540" y="330" width="230" height="100" rx="10" fill="#fff" stroke="#3730A3" stroke-width="1.6"/>
<text x="655" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">Kiorly Lab</text><text x="655" y="395" text-anchor="middle" font-size="11" fill="#475569">kiorly-lab · :3200 / :5193</text><rect x="790" y="330" width="270" height="100" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="925" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">kiorly</text><text x="925" y="395" text-anchor="middle" font-size="11" fill="#64748B">mobile staff app for Kiorly</text><text x="550" y="462" text-anchor="middle" font-size="12" fill="#0369A1" font-weight="600">Every repo imports a pinned @kiorex/contracts and validates against it in CI. Kiorly Clinic also signs in via Passport (OIDC, confidential client).</text><rect x="40" y="485" width="1020" height="50" rx="10" fill="#FFF1EE" stroke="#E8735E" stroke-width="1.6"/>
<text x="550" y="515" text-anchor="middle" font-size="12" font-weight="600" fill="#1E1B4B">Control plane: Kiorex super admin owns feature flags. Capabilities ship ON; OFF gives 403 FEATURE_DISABLED. Safety controls are never flags.</text><path d="M40 560h357l51-8l71.416l71.4-22l61.19999999999999614h408" stroke="#E8735E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
